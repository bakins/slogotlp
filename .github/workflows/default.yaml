name: default
env:
  CGO_ENABLED: 0
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  gotest:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go test -v ./...
        shell: bash
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
